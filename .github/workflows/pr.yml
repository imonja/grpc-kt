name: Pull Request

on:
    pull_request:
    workflow_dispatch:

# Manual runs have no pull request number, so they are grouped by ref; otherwise runs on different branches would cancel each other
concurrency:
    group: pr-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            -   uses: actions/checkout@v7
            -   uses: ./.github/actions/ci-checks
